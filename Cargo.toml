[workspace]
resolver = "3"
members = ["crates/inkling-core", "crates/inkling-cuda", "crates/inkling-engine", "crates/inkling-cli", "crates/inkling-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ManyGlue0/InklingEngine"

[workspace.dependencies]
anyhow = "1.0.104"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }
half = "2.7.1"
memmap2 = "0.9.12"

[profile.release]
debug = "line-tables-only"
