[package]
name = "inkling-cli"
description = "InklingEngine command line: smoke tests, benchmarks, chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "inkling"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
inkling-core = { path = "../inkling-core" }
inkling-cuda = { path = "../inkling-cuda" }
inkling-engine = { path = "../inkling-engine" }
inkling-server = { path = "../inkling-server" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
